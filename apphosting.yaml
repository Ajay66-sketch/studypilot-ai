# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

env:
  # Public Client-side Firebase Configurations (Required at Build-time)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDummyKey"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "studypilot-ai.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "studypilot-ai"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "studypilot-ai.appspot.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "123456789"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:123456789:web:abcdef"
    availability: [BUILD, RUNTIME]

  # Public Client-side Razorpay Key
  - variable: NEXT_PUBLIC_RAZORPAY_KEY_ID
    value: "rzp_test_dummy_key"
    availability: [BUILD, RUNTIME]

  # Server-side Secrets (Managed securely via Cloud Secret Manager)
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability: [RUNTIME]
  - variable: RAZORPAY_KEY_SECRET
    secret: RAZORPAY_KEY_SECRET
    availability: [RUNTIME]

runConfig:
  # Minimum and maximum Cloud Run instances
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512

